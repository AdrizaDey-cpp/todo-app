<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <title>{% block title %}{% endblock title %} - MyTodo</title>
</head>

<body>

<!-- 🔹 NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">

        <a class="navbar-brand" href="/">MyTodo</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarSupportedContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">

            <!-- Left side -->
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                <li class="nav-item">
                    <a class="nav-link active" href="/">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/about">About</a>
                </li>

            </ul>

            <!-- 🔍 SEARCH (only when logged in) -->
            {% if current_user.is_authenticated %}
            <form class="d-flex me-3" method="GET" action="/">
                <input
                    class="form-control me-2"
                    type="search"
                    name="search"
                    placeholder="Search Todos"
                    value="{{ request.args.get('search','') }}"
                >
                <button class="btn btn-outline-dark" type="submit">Search</button>
                <a href="/" class="btn btn-outline-secondary ms-2">Clear</a>
            </form>
            {% endif %}

            <!-- 🔐 AUTH BUTTONS -->
            <ul class="navbar-nav">

                {% if current_user.is_authenticated %}
                    <li class="nav-item">
                        <span class="nav-link">👋 {{ current_user.username }}</span>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link btn btn-outline-danger ms-2" href="/logout">
                            Logout
                        </a>
                    </li>

                {% else %}

                    <li class="nav-item">
                        <a class="nav-link btn btn-outline-dark me-2" href="/login">
                            Login
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link btn btn-primary" href="/signup">
                            Signup
                        </a>
                    </li>

                {% endif %}

            </ul>

        </div>
    </div>
</nav>

<!-- 🔹 BODY -->
{% block body %}
{% endblock body %}

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
